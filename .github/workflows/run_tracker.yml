name: Run availability watch

on:
  workflow_dispatch:

concurrency:
  group: availability-watch
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-python-3.11-${{ hashFiles('requirements.txt') }}

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install browser when cache is empty
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Print trigger diagnostics
        run: |
          echo "UTC time: $(date -u)"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Run: $GITHUB_RUN_NUMBER"

      - name: Run watch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
        run: python tracker.py

      - name: Warn after three consecutive failures
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python failure_monitor.py
