name: Run AMC Ticket Tracker

on:
  workflow_dispatch:
  schedule:
    # Low cadence: every 30 minutes, all day
    - cron: "*/30 * * * *"

    # High-risk window: every 5 minutes from 10:00 AM–1:55 PM ET, Mon-Fri.
    # In June/July, New York is UTC-4, so 10 AM–2 PM ET = 14:00–18:00 UTC.
    - cron: "*/5 14-17 * * 1-5"

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          pip install requests playwright
          python -m playwright install chromium

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py
