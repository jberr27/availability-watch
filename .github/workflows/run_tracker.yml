name: Run AMC Ticket Tracker

on:
  workflow_dispatch:
  schedule:
    # Low cadence: every ~30 minutes, avoiding :00 and :30 GitHub congestion
    - cron: "7,37 * * * *"

    # High-risk window: every 5 minutes from 10:00 AM–1:55 PM ET, Mon-Fri.
    # In June/July, New York is UTC-4, so 10 AM–2 PM ET = 14:00–18:00 UTC.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 14-17 * * 1-5"

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-python-3.11-v1

      - name: Install Python packages
        run: |
          pip install requests playwright

      - name: Install Playwright Chromium if needed
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install chromium

      - name: Print schedule diagnostics
        run: |
          echo "GitHub triggered this workflow at UTC:"
          date -u
          echo "Event name: $GITHUB_EVENT_NAME"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "Run attempt: $GITHUB_RUN_ATTEMPT"

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py
