name: Schedule Probe

on:
  workflow_dispatch:
  schedule:
    # Lightweight probe: every 5 minutes, avoiding :00/:05/etc.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

jobs:
  schedule-probe:
    runs-on: ubuntu-latest

    steps:
      - name: Print probe time
        run: |
          echo "Schedule probe fired."
          echo "UTC time:"
          date -u
          echo "Event name: $GITHUB_EVENT_NAME"
          echo "Run number: $GITHUB_RUN_NUMBER"
