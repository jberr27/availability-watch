name: Daily tracker heartbeat

on:
  workflow_dispatch:
  schedule:
    # About 10:17 AM New York during daylight saving time and 9:17 AM otherwise.
    # The uncommon minute reduces GitHub scheduler congestion.
    - cron: "17 14 * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Send daily heartbeat
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python heartbeat.py
